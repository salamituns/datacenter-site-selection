name: Client CI

on:
  push:
    paths:
      - 'client/**'
      - '.github/workflows/client_ci.yml'
    branches:
      - main
  pull_request:
    paths:
      - 'client/**'
      - '.github/workflows/client_ci.yml'

jobs:
  verify:
    name: Typecheck, Test & Build (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit Tests (scoring, spatial, null-safety)
        run: npm test

      - name: Production Build
        run: npm run build
        env:
          # Keys are optional at build time: the client falls back to
          # demo data when they are absent, so CI builds without secrets.
          NEXT_PUBLIC_SUPABASE_URL: ''
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ''
