name: Data Ingestion & ML Pipeline

on:
  schedule:
    # Run weekly on Sundays at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      state:
        description: 'State code (e.g. VA, TX, OH)'
        required: true
        default: 'VA'
      county:
        description: 'County or Region name'
        required: true
        default: 'Loudoun'
      dry_run:
        description: 'Dry run mode (do not push to Supabase)'
        type: boolean
        default: false
  push:
    paths:
      - 'worker/**'
      - '.github/workflows/data_pipeline.yml'
    branches:
      - main

jobs:
  run-pipeline:
    name: Run Ingestion, Scikit-Learn Clustering & Supabase PostGIS Sync
    runs-on: ubuntu-latest
    # A publishing run measured 23m25s: no cache, the NWI geodatabase
    # fallback, and the atomic promote on top of the ingest. A dry run is
    # ~15m. 45 leaves real headroom for a slow upstream week while still
    # capping the job — without this it inherits GitHub's 360-minute
    # default, so one hung download would burn six hours of Actions
    # minutes before anything noticed.
    timeout-minutes: 45

    env:
      # A push under worker/ validates the pipeline end to end without
      # publishing: it needs no credentials, and a code change can never
      # write to the production database on its own. Publication is
      # reserved for the weekly cron and manual dispatch.
      DRY_RUN: ${{ (github.event_name == 'push' || github.event.inputs.dry_run == 'true') && '--dry-run' || '' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Geospatial Libraries (GDAL / GEOS / PROJ)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev

      - name: Install Python Dependencies
        run: |
          cd worker
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Steps 6b and 6c are 78% of a cold run (~12 of ~15 minutes), almost
      # all of it re-downloading and re-clipping the same 64 MB: PAD-US
      # protected land, the NWI wetlands geodatabase and the PJM RTEP XML.
      # The pipeline already reuses these from worker/cache when present.
      #
      # Restored for dry runs only. A publishing run must not build on a
      # stale snapshot — RTEP upgrades change week to week — so cron and
      # dispatch always re-download and pay the full cost deliberately.
      - name: Restore clipped geospatial datasets
        if: env.DRY_RUN != ''
        uses: actions/cache@v4
        with:
          path: worker/cache
          key: worker-cache-${{ hashFiles('worker/overlay_layers.py', 'worker/power_evidence.py', 'worker/assessment_evidence.py', 'worker/network_evidence.py') }}
          restore-keys: |
            worker-cache-

      - name: Run Pipeline & Sync PostGIS Data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd worker
          STATE="${{ github.event.inputs.state || 'VA' }}"
          COUNTY="${{ github.event.inputs.county || 'Loudoun' }}"

          echo "Running pipeline for $COUNTY, $STATE (dry run: ${DRY_RUN:-no})..."
          python pipeline.py --state "$STATE" --county "$COUNTY" $DRY_RUN
