name: Data Ingestion & ML Pipeline

on:
  schedule:
    # Run weekly on Sundays at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      region:
        description: 'Region slug (e.g. VA-LOUDOUN, OH-FRANKLIN, OH-LICKING, TX-TAYLOR, OR-MORROW)'
        required: true
        default: 'VA-LOUDOUN'
      dry_run:
        description: 'Dry run mode (do not push to Supabase)'
        type: boolean
        default: false
  push:
    paths:
      - 'worker/**'
      - '.github/workflows/data_pipeline.yml'
    branches:
      - main

jobs:
  # Which regions this run covers. The weekly cron used to take the
  # workflow's own default and refresh VA-LOUDOUN alone, so the other four
  # regions drifted until somebody dispatched them by hand — which is
  # exactly how Licking came to publish under a superseded zoning rule.
  #
  # The list is read out of worker/pipeline.py rather than restated here.
  # A region added to SURVEY_REGIONS joins the weekly refresh with no
  # workflow edit, and the two cannot disagree about what exists. Parsed
  # with ast instead of imported: the real module needs geopandas and the
  # whole geospatial stack, and this job only needs the names.
  regions:
    name: Resolve regions
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.resolve.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import ast, json, os
          event = os.environ["EVENT"]
          requested = os.environ.get("REGION") or ""
          if event == "schedule":
              tree = ast.parse(open("worker/pipeline.py").read())
              regions = next(
                  [e.value for e in n.value.elts]
                  for n in tree.body
                  if isinstance(n, ast.AnnAssign)
                  and getattr(getattr(n, "target", None), "id", "") == "SURVEY_REGIONS"
              )
              if not regions:
                  raise SystemExit("SURVEY_REGIONS parsed empty; refusing to "
                                   "run a weekly refresh over no regions")
          else:
              # A manual dispatch runs what was asked for; a push validates
              # one region as a dry run, since the point is the code path
              # and not the coverage.
              regions = [requested or "VA-LOUDOUN"]
          print("list=" + json.dumps(regions))
          PY
        env:
          EVENT: ${{ github.event_name }}
          REGION: ${{ github.event.inputs.region }}

  run-pipeline:
    name: ${{ matrix.region }}
    needs: regions
    runs-on: ubuntu-latest
    strategy:
      # One region at a time. Four concurrent publishes would quadruple
      # request pressure on 3DEP, PAD-US, NWI and TIGERweb from one IP
      # range, and this repo has been rate-limited by two of them already.
      max-parallel: 1
      # A region that fails must not cancel the rest: one county's cadastre
      # going down is not a reason to leave four others a week stale.
      fail-fast: false
      matrix:
        region: ${{ fromJson(needs.regions.outputs.list) }}
    # A Franklin publish (982 parcels) measured 23m25s: no cache, the NWI
    # geodatabase fallback, and the atomic promote on top of the ingest.
    # The Licking corridor survey is ~2,900 parcels, so 90 leaves headroom
    # for it and for a slow upstream week while still capping the job —
    # without this it inherits GitHub's 360-minute default, so one hung
    # download would burn six hours of Actions minutes before anything
    # noticed.
    timeout-minutes: 90

    env:
      # One source of truth for whether this run publishes. The --dry-run
      # flag and the credential gate below both derive from it, so they
      # cannot disagree — and disagreeing is exactly what happened before:
      # the comment here said a push "needs no credentials" while the run
      # step handed every push the production service-role key.
      #
      # A push under worker/ validates the pipeline end to end without
      # publishing. Publication is reserved for the weekly cron and manual
      # dispatch.
      PUBLISHING: ${{ github.event_name != 'push' && github.event.inputs.dry_run != 'true' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Geospatial Libraries (GDAL / GEOS / PROJ)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev

      - name: Install Python Dependencies
        run: |
          cd worker
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Runs before any network fetch: the gate logic, the JSON guards, the
      # SQL rounding parity and the overlay geometry are all decidable
      # offline, and a run that would compute wrong verdicts should fail in
      # seconds rather than 13 minutes later with a published result.
      - name: Worker unit tests
        run: |
          cd worker
          python -m pytest -q

      # Most of a cold run is re-downloading the same fixed datasets:
      # PAD-US, the NWI state geodatabases, the county parcel and
      # assessment files. The pipeline reuses these from worker/cache.
      #
      # Restored on every run, including publishes. Skipping it on
      # publishes was too blunt: it forced a re-download of artefacts that
      # cannot change — a shapefile whose own filename carries the date it
      # was cut — and Taylor County's server answered a publish run with
      # 429 Too Many Requests, which failed the run outright. Freshness is
      # instead enforced below, on the one file that actually moves.
      - name: Restore clipped geospatial datasets
        uses: actions/cache@v4
        with:
          path: worker/cache
          key: worker-cache-${{ hashFiles('worker/overlay_layers.py', 'worker/power_evidence.py', 'worker/assessment_evidence.py', 'worker/network_evidence.py', 'worker/franklin_api.py', 'worker/taylor_api.py') }}
          restore-keys: |
            worker-cache-

      # PJM republishes RTEP upgrade costs and in-service dates weekly, so
      # a publishing run must not read last week's copy. Everything else in
      # the cache is a dated or annual artefact and is reused. Targeted
      # rather than clearing the cache, so one moving file does not cost a
      # re-download of a gigabyte of static ones.
      - name: Force-refresh time-varying sources on a publishing run
        if: env.PUBLISHING == 'true'
        run: rm -f worker/cache/pjm_project_cost_upgrades.xml

      - name: Run Pipeline & Sync PostGIS Data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # Withheld from a dry run. A push under worker/ runs code that has
          # not necessarily been reviewed, and handing it a key that can
          # write to production is a standing risk for no benefit: a dry run
          # never opens a write client.
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.PUBLISHING == 'true' && secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
          # A dry run still reads constraint_rules, which is world-readable.
          # Giving it no key at all would not be safer, it would be wrong:
          # load_rules_readonly falls back to built-in defaults, and a
          # zoning-supplying region then refuses the run outright rather
          # than deciding against another county's use table. The anon key
          # is the publishable one already shipped in the browser bundle —
          # it reads what RLS allows and cannot write.
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # Reads the mirrored Taylor County shapefile from this repo's
          # releases. The district's host blocks datacenter IPs, so a CI
          # runner cannot fetch from source; the repo is private, so the
          # asset needs the token rather than a public download URL.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd worker
          REGION="${{ matrix.region }}"

          # Defaults to a dry run: if PUBLISHING is ever unset or malformed,
          # the run declines to publish rather than publishing by accident.
          DRY_RUN="--dry-run"
          if [ "$PUBLISHING" = "true" ]; then DRY_RUN=""; fi

          echo "Running pipeline for $REGION (publishing: $PUBLISHING)..."
          python pipeline.py --region "$REGION" $DRY_RUN

  # Once every region has published, drop the generations nothing reads.
  # The promote deletes by run_id and re-inserts, so each republish leaves a
  # full generation behind: 88.5% of parcel_metric_values was superseded
  # history before this existed. Runs here rather than inside promote so a
  # defect in the keep-set logic cannot destroy history on every publish —
  # and after the matrix, so it prunes a consistent set rather than pruning
  # mid-refresh while four regions still carry last week's runs.
  #
  # always() so a region that failed does not leave the pruning skipped for
  # a week; the keep set is computed from what actually published.
  prune:
    name: Prune superseded evidence
    needs: run-pipeline
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      # --fail-with-body, not plain -sS: PostgREST answers a missing function
      # or a bad key with a 404/401 and a JSON body, and curl exits 0 on both.
      # This step would then print the error and report success -- the shape of
      # failure this pipeline has produced before. Exit on the status code, and
      # assert on the payload rather than trusting that 200 meant it ran.
      - name: Prune
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          response=$(curl -sS --fail-with-body --retry 2 --max-time 1500 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/prune_superseded_evidence" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"p_execute": true}')
          echo "$response" | python3 -m json.tool
          python3 -c "
          import json, sys
          r = json.loads(sys.argv[1])
          if not r.get('executed'):
              sys.exit('prune returned executed=false -- it ran as a dry run')
          if not r.get('runs_retained'):
              sys.exit('prune retained no runs -- refusing to call this a success')
          m, g = r['metrics'], r['gates']
          print(f\"pruned {m['deleted']:,} metric rows and {g['deleted']:,} gate \"
                f\"rows across {r['runs_retained']} retained runs; \"
                f\"{m['retained']:,} metrics and {g['retained']:,} gates kept\")
          " "$response"
